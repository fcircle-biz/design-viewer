<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設計ビューア</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="app">

  <canvas id="stage" tabindex="0"></canvas>

  <div id="titleCard" class="v-card">
    <div class="v-title-row">
      <div class="v-title" id="titleText"></div>
    </div>
    <div class="v-subtitle" id="subtitleText"></div>
    <div class="v-status" id="statusNote"></div>
    <div class="v-mode-desc" id="modeDesc"></div>
  </div>

  <div id="searchCard" class="v-card">
    <div class="v-search-row">
      <svg class="v-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <input id="searchInput" type="text" placeholder="検索（ID・タイトル・ラベル） / キー: /">
    </div>
    <div id="searchResults" class="v-search-results"></div>
  </div>

  <div id="legendCard" class="v-card">
    <div class="v-card-heading">凡例</div>
    <div id="legendList" class="v-legend-list"></div>
    <div id="toggleList" class="v-toggle-list"></div>
  </div>

  <div id="stepsCard" class="v-card" hidden>
    <div class="v-card-heading">
      <span>ステップ</span>
      <button id="stepPlay" class="v-icon-btn" type="button" aria-label="自動再生">▶</button>
    </div>
    <div id="stepList" class="v-step-list"></div>
  </div>

  <div id="minimapCard" class="v-card" hidden>
    <canvas id="minimapCanvas"></canvas>
  </div>

  <aside id="detailPanel" class="v-card" hidden>
    <div id="detailResizeHandle" class="v-panel-resize" title="ドラッグして幅を変更（ダブルクリックで既定幅）"></div>
    <button id="closePanel" class="v-icon-btn v-panel-close" type="button" aria-label="閉じる">×</button>
    <div id="panelBody" class="v-panel-body"></div>
  </aside>

  <div id="toolbar" class="v-card v-toolbar">
    <div class="v-seg" id="modeSeg" role="tablist" aria-label="表示モード">
      <button class="v-seg-btn" data-mode="flow" type="button">画面遷移</button>
      <button class="v-seg-btn" data-mode="gallery" type="button">画面イメージ</button>
      <button class="v-seg-btn" data-mode="concept" type="button">概念図</button>
      <button class="v-seg-btn" data-mode="biz" type="button">業務フロー</button>
      <button class="v-seg-btn" data-mode="er" type="button">ER 図</button>
      <button class="v-seg-btn" data-mode="dfd" type="button">データフロー</button>
    </div>
    <div class="v-toolbar-sep"></div>
    <button id="neighborToggle" class="v-neighbor-btn" type="button">近傍のみ</button>
    <div class="v-toolbar-sep"></div>
    <div class="v-zoom">
      <button id="zoomOut" class="v-icon-btn" type="button" aria-label="縮小">−</button>
      <div id="zoomPct" class="v-zoom-pct">100%</div>
      <button id="zoomIn" class="v-icon-btn" type="button" aria-label="拡大">＋</button>
      <button id="zoomFit" class="v-fit-btn" type="button">全体表示</button>
    </div>
  </div>

  <div id="previewModal">
    <div class="v-modal-box">
      <div class="v-modal-head">
        <div class="v-modal-title" id="modalTitle"></div>
        <div class="v-modal-actions">
          <button id="modalScale100" class="v-modal-scale-btn" type="button">等倍</button>
          <button id="modalScaleFit" class="v-modal-scale-btn v-active" type="button">縮小表示</button>
          <button id="modalClose" class="v-icon-btn" type="button" aria-label="閉じる">×</button>
        </div>
      </div>
      <div class="v-modal-body" id="modalBody"></div>
    </div>
  </div>

</div>

<script src="viewer-data.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-model.js"></script>
<script src="js/03-mode.js"></script>
<script src="js/04-minimap-raster.js"></script>
<script src="js/05-shapes.js"></script>
<script src="js/06-render.js"></script>
<script src="js/07-draw-groups-edges.js"></script>
<script src="js/08-draw-nodes.js"></script>
<script src="js/09-panel.js"></script>
<script src="js/10-input.js"></script>
<script src="js/11-main.js"></script>
</body>
</html>

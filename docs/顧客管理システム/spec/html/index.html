<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設計ビューア</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="app">

  <canvas id="stage" tabindex="0"></canvas>

  <div id="titleCard" class="v-card">
    <div class="v-title-row">
      <div class="v-title" id="titleText"></div>
    </div>
    <div class="v-subtitle" id="subtitleText"></div>
    <div class="v-status" id="statusNote"></div>
    <div class="v-mode-desc" id="modeDesc"></div>
  </div>

  <div id="searchCard" class="v-card">
    <div class="v-search-row">
      <svg class="v-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <input id="searchInput" type="text" placeholder="検索（ID・タイトル・ラベル） / キー: /">
    </div>
    <div id="searchResults" class="v-search-results"></div>
  </div>

  <div id="legendCard" class="v-card">
    <div class="v-card-heading">凡例</div>
    <div id="legendList" class="v-legend-list"></div>
    <div id="toggleList" class="v-toggle-list"></div>
  </div>

  <div id="stepsCard" class="v-card" hidden>
    <div class="v-card-heading">
      <span>ステップ</span>
      <button id="stepPlay" class="v-icon-btn" type="button" aria-label="自動再生">▶</button>
    </div>
    <div id="stepList" class="v-step-list"></div>
  </div>

  <div id="jobFilterCard" class="v-card" hidden>
    <label class="v-card-heading" for="jobFilterSelect">機能で絞り込む</label>
    <select id="jobFilterSelect" class="v-select"></select>
  </div>

  <div id="minimapCard" class="v-card" hidden>
    <canvas id="minimapCanvas"></canvas>
  </div>

  <aside id="detailPanel" class="v-card" hidden>
    <div id="detailResizeHandle" class="v-panel-resize" title="ドラッグして幅を変更（ダブルクリックで既定幅）"></div>
    <button id="closePanel" class="v-icon-btn v-panel-close" type="button" aria-label="閉じる">×</button>
    <div id="panelBody" class="v-panel-body"></div>
  </aside>

  <div id="toolbar" class="v-card v-toolbar">
    <div class="v-seg" id="modeSeg" role="tablist" aria-label="表示モード">
      <button class="v-seg-btn" data-mode="concept" type="button">概念図</button>
      <button class="v-seg-btn" data-mode="biz" type="button">業務フロー</button>
      <button class="v-seg-btn" data-mode="gallery" type="button">機能一覧</button>
      <button class="v-seg-btn" data-mode="flow" type="button">画面遷移図</button>
      <button class="v-seg-btn" data-mode="er" type="button">ER図</button>
      <button class="v-seg-btn" data-mode="dfd" type="button">データフロー</button>
      <button class="v-seg-btn" data-mode="jobflow" type="button">ジョブフロー</button>
      <button class="v-seg-btn" data-mode="arch" type="button">構成図</button>
    </div>
    <div class="v-toolbar-sep"></div>
    <!-- 1 行に収めるため、モード切替以外はアイコンボタン（名前は title のツールチップと aria-label） -->
    <button id="neighborToggle" class="v-tool-btn" type="button" title="近傍のみ（選択ノードの隣接だけ表示）" aria-label="近傍のみ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="18" cy="19" r="1.8"/><path d="M6.4 6.4l3.5 3.5M17.4 7.1l-3.2 3M16.7 17.6l-2.6-3.3"/></svg>
    </button>
    <button class="v-tool-btn v-card-toggle" data-card="titleCard" type="button" aria-pressed="true" title="概要（左上のシステム概要）の表示・非表示" aria-label="概要">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="0.4" fill="currentColor"/></svg>
    </button>
    <button class="v-tool-btn v-card-toggle" data-card="legendCard" type="button" aria-pressed="true" title="凡例（左下）の表示・非表示" aria-label="凡例">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h4M11.5 7H20M4 12h1.2M7 12h1.2M11.5 12H20M4 17h4M11.5 17H20"/></svg>
    </button>
    <div class="v-toolbar-sep"></div>
    <div class="v-zoom">
      <button id="zoomOut" class="v-tool-btn" type="button" title="縮小（-）" aria-label="縮小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <div id="zoomPct" class="v-zoom-pct">100%</div>
      <button id="zoomIn" class="v-tool-btn" type="button" title="拡大（+）" aria-label="拡大">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg>
      </button>
      <button id="zoomFit" class="v-tool-btn" type="button" title="全体表示（F）" aria-label="全体表示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div id="previewModal">
    <div class="v-modal-box">
      <div class="v-modal-head">
        <div class="v-modal-title" id="modalTitle"></div>
        <div class="v-modal-actions">
          <button id="modalScale100" class="v-modal-scale-btn" type="button">等倍</button>
          <button id="modalScaleFit" class="v-modal-scale-btn v-active" type="button">縮小表示</button>
          <button id="modalClose" class="v-icon-btn" type="button" aria-label="閉じる">×</button>
        </div>
      </div>
      <div class="v-modal-body" id="modalBody"></div>
    </div>
  </div>

</div>

<script src="viewer-data.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-model.js"></script>
<script src="js/03-mode.js"></script>
<script src="js/04-minimap-raster.js"></script>
<script src="js/05-shapes.js"></script>
<script src="js/06-render.js"></script>
<script src="js/07-draw-groups-edges.js"></script>
<script src="js/08-draw-nodes.js"></script>
<script src="js/09-panel.js"></script>
<script src="js/10-input.js"></script>
<script src="js/11-main.js"></script>
</body>
</html>

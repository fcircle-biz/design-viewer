<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>商品登録・編集</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .alerts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .add-tile {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    border: 1px dashed #d1d5db;
    background: #fafafa;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .image-badge {
    position: relative;
  }
  .image-main-tag {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    background: #2563eb;
    color: #fff;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="screen">
  <div class="app">
    <header class="header">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        商品管理
      </div>
      <nav class="nav">
        <a>ダッシュボード</a>
        <a class="active">商品</a>
        <a>カテゴリ</a>
        <a>入出庫</a>
        <a>ユーザー</a>
      </nav>
      <div class="header-user">
        山田 花子
        <span class="avatar">山</span>
      </div>
    </header>
    <main class="main">
      <div class="breadcrumb">商品 &gt; 北欧風マグカップ &gt; 編集</div>
      <div class="page-head">
        <h1 class="page-title">商品編集</h1>
        <div class="page-actions">
          <button class="btn btn-secondary">キャンセル</button>
          <button class="btn btn-primary">保存</button>
        </div>
      </div>

      <div class="alerts">
        <div class="alert alert-info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          在庫数は入出庫登録でのみ変更できます。
        </div>
        <div class="alert alert-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          公開するには画像を1枚以上登録してください。
        </div>
      </div>

      <div class="grid-2" style="gap: 16px; align-items: start">
        <div class="card">
          <h2 class="card-title">基本情報</h2>
          <div class="form-grid">
            <div class="field">
              <label class="required">SKU</label>
              <input class="input" value="MUG-0031" disabled style="background: #f3f4f6; color: #6b7280" />
              <span class="help">登録後は変更できません</span>
            </div>
            <div class="field">
              <label class="required">商品名</label>
              <input class="input" value="北欧風マグカップ" />
            </div>
            <div class="field">
              <label class="required">カテゴリ</label>
              <select class="select">
                <option>キッチン雑貨</option>
                <option>インテリア</option>
                <option>文房具</option>
                <option>アクセサリー</option>
              </select>
            </div>
            <div class="field">
              <label class="required">価格（税込）</label>
              <input class="input" type="text" value="¥1,480" />
            </div>
            <div class="field">
              <label>公開状態</label>
              <div class="segmented">
                <span>下書き</span>
                <span class="active">公開</span>
                <span>アーカイブ</span>
              </div>
            </div>
            <div class="field full">
              <label>説明</label>
              <textarea class="textarea">北欧デザインをイメージした厚手のマグカップ。電子レンジ・食洗機対応。容量320ml。</textarea>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">商品画像</h2>
          <div class="thumb-row">
            <div class="thumb image-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span class="image-main-tag">メイン</span>
            </div>
            <div class="thumb">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="add-tile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
          </div>
          <div class="help" style="margin-top: 12px">
            JPEG/PNG・5MB以下・最大5枚。先頭がメイン画像
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
